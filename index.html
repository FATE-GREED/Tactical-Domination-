<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1f18">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Tactical Domination</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<div id="resLeft" class="panel"></div>
<div id="resRight" class="panel"></div>

<div id="hud" class="panel collapsed">
  <div class="panel-header">
    <h2>Tactical Domination</h2>
    <button class="collapse-btn" onclick="togglePanel('hud')">▾</button>
  </div>
  <div class="panel-body">
    <small>v8 — Lawan Bot (Sulit)</small><br>
    <small>Ketuk tile = ikon info/entitas<br>Tahan lama unit = pilih target<br>Tahan lama hex = Bangun / Tempati<br>Kalah jika semua Markas hancur</small>
  </div>
</div>

<div id="turnbar" class="panel">
  <span><span class="dot" id="turndot"></span><b id="turntext">Giliran Pemain 1</b> — Turn <span id="turnnum">1</span></span>
  <span id="timer" class="timer"></span>
  <button id="laneBtn" title="Gambar jalur">🌊 Jalur</button>
  <button id="sndBtn" title="Suara">🔊</button>
  <button id="pauseBtn">⏸ Pause</button>
  <button id="endturn">Eksekusi ▶</button>
</div>

<div id="dmgfeed"></div>
<div id="killfeed"></div>
<div id="targetpanel" class="panel"></div>
<div id="deploy" class="panel"></div>
<div id="entitypanel" class="panel"></div>
<div id="actionpanel" class="panel">
  <span id="actioninfo"></span>
  <button id="cancelBtn">Batal</button>
</div>
<div id="info" class="panel"></div>
<div id="actionlog" class="panel"></div>
<div id="legend" class="panel"></div>

<div id="gameover">
  <div class="box">
    <h2 id="winnerText">Pemain 1 Menang!</h2>
    <p>Seluruh Markas lawan telah hancur.</p>
    <button id="restartBtn">Main Lagi</button>
  </div>
</div>

<!-- Urutan penting: state dulu, lalu modul yang bergantung padanya, main.js paling akhir -->
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/map-gen.js"></script>
<script src="js/setup.js"></script>
<script src="js/rules-movement.js"></script>
<script src="js/rules-economy.js"></script>
<script src="js/rules-abilities.js"></script>
<script src="js/rules-supply.js"></script>
<script src="js/rules-combat.js"></script>
<script src="js/rules-detection.js"></script>
<script src="js/rules-win.js"></script>
<script src="js/rules-auto.js"></script>
<script src="js/render-fx.js"></script>
<script src="js/render.js"></script>
<script src="js/ui-orders.js"></script>
<script src="js/bot.js"></script>
<script src="js/lanes.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>

</body>
</html>
